<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Villa Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/logo-64.png">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.emailjs.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="ad">

<main class="ad-login" id="login-view">
  <aside class="ad-login__art" aria-hidden="true">
    <img src="/images/hero.jpg" alt="">
    <div class="ad-login__quote"><strong>Sam Villa</strong><span>Bookings, guests and the site, all in one calm place.</span></div>
  </aside>
  <form class="ad-card ad-login__card" id="login-form" autocomplete="on" novalidate>
    <span class="ad-mark" aria-hidden="true"><img src="/images/logo-64.png" alt="" width="36" height="36"></span>
    <h1 class="ad-h">Admin sign in</h1>
    <p class="ad-muted">Sam Villa staff only.</p>
    <label class="ad-field"><span>Email</span><input id="login-email" type="email" autocomplete="username" required maxlength="120"></label>
    <label class="ad-field"><span>Password</span><input id="login-pass" type="password" autocomplete="current-password" required maxlength="200"></label>
    <p class="ad-error" id="login-error" role="alert" hidden></p>
    <p class="ad-muted" id="login-status" role="status">Connecting...</p>
    <button class="ad-btn ad-btn--primary" id="login-btn" type="submit" disabled>Sign in</button>
  </form>
</main>

<main class="ad-login" id="setup-view" hidden>
  <div class="ad-card ad-login__card">
    <span class="ad-mark" aria-hidden="true"><img src="/images/logo-64.png" alt="" width="36" height="36"></span>
    <h1 class="ad-h">Backend not connected</h1>
    <p class="ad-muted">Add your Firebase web config to <code>js/firebase-config.js</code>, then reload. Full steps are in <code>ADMIN.md</code>.</p>
  </div>
</main>

<div id="dash-view" class="ad-shell" hidden>
  <header class="ad-side">
    <span class="ad-brand"><span class="ad-mark" aria-hidden="true"><img src="/images/logo-64.png" alt="" width="36" height="36"></span><span>Sam Villa<small>Admin</small></span></span>
    <nav class="ad-tabs" id="tabs" aria-label="Sections" role="tablist">
        <button class="ad-tab is-on" type="button" role="tab" data-tab="overview" aria-selected="true"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M104,40H56A16,16,0,0,0,40,56v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,104,40Zm0,64H56V56h48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,64H152V56h48Zm-96,32H56a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,104,136Zm0,64H56V152h48Zm96-64H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,200,136Zm0,64H152V152h48Z"/></svg><span>Overview</span></button>
        <button class="ad-tab" type="button" role="tab" data-tab="bookings" aria-selected="false"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Z"/></svg><span>Bookings</span> <span class="ad-badge" id="bk-count" hidden></span></button>
        <button class="ad-tab" type="button" role="tab" data-tab="messages" aria-selected="false"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"/></svg><span>Messages</span> <span class="ad-badge" id="ms-count" hidden></span></button>
        <button class="ad-tab" type="button" role="tab" data-tab="rooms" aria-selected="false"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,72H32V48a8,8,0,0,0-16,0V208a8,8,0,0,0,16,0V176H240v32a8,8,0,0,0,16,0V112A40,40,0,0,0,216,72ZM32,88h72v72H32Zm88,72V88h96a24,24,0,0,1,24,24v48Z"/></svg><span>Rooms and rates</span></button>
        <button class="ad-tab" type="button" role="tab" data-tab="reviews" aria-selected="false"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Zm-15.6-10.6-59-4.76a8,8,0,0,1-6.72-4.94L128,39.43,105,94.55a8,8,0,0,1-6.72,4.94l-59,4.76,45,38.83a8,8,0,0,1,2.56,7.92L73.11,209.07l50.67-31.19a8,8,0,0,1,8.43,0l50.68,31.19-13.81-58.07a8,8,0,0,1,2.56-7.92Z"/></svg><span>Reviews</span></button>
        <button class="ad-tab" type="button" role="tab" data-tab="content" aria-selected="false"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg><span>Content</span></button>
    </nav>
    <div class="ad-side__end">
      <a class="ad-link" href="/" target="_blank" rel="noopener"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm88,104a87.62,87.62,0,0,1-6.4,32.94l-44.7-27.49a15.92,15.92,0,0,0-6.24-2.23l-22.82-3.08a16.11,16.11,0,0,0-16,7.86h-8.72l-3.8-7.86a15.91,15.91,0,0,0-11-8.67l-8-1.73L96.14,104h16.71a16.06,16.06,0,0,0,7.73-2l12.25-6.76a16.62,16.62,0,0,0,3-2.14l26.91-24.34A15.93,15.93,0,0,0,166,49.1l-.36-.65A88.11,88.11,0,0,1,216,128ZM40,128a87.53,87.53,0,0,1,8.54-37.8l11.34,30.27a16,16,0,0,0,11.62,10l21.43,4.61L96.74,143a16.09,16.09,0,0,0,14.4,9h1.48l-7.23,16.23a16,16,0,0,0,2.86,17.37l.14.14L128,205.94l-1.94,10A88.11,88.11,0,0,1,40,128Z"/></svg><span>View site</span></a>
      <div class="ad-user"><span class="ad-avatar" id="who-init" aria-hidden="true"></span><span class="ad-who" id="who"></span></div>
      <button class="ad-btn ad-btn--ghost" id="logout" type="button"><svg class="ad-ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/></svg><span>Sign out</span></button>
    </div>
  </header>

  <main class="ad-main">
    <p class="ad-toast" id="toast" role="status" aria-live="polite" hidden></p>
    <section class="ad-panel" id="panel-overview" role="tabpanel"></section>
    <section class="ad-panel" id="panel-bookings" role="tabpanel" hidden></section>
    <section class="ad-panel" id="panel-messages" role="tabpanel" hidden></section>
    <section class="ad-panel" id="panel-rooms" role="tabpanel" hidden></section>
    <section class="ad-panel" id="panel-reviews" role="tabpanel" hidden></section>
    <section class="ad-panel" id="panel-content" role="tabpanel" hidden></section>
  </main>
</div>

<script src="/js/firebase-config.js"></script>
<script src="/js/payment-config.js"></script>
<script src="/js/fb.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
