<!doctype html>
<html lang="en">
<head>

<title>Sam Villa</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .jungle { fill:var(--jungle); }
  .coral { fill:var(--coral); }
  .soft { fill:var(--jungle-soft); }
  .ground { fill:var(--ground); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:600; font-size:104px; line-height:.95; letter-spacing:-.03em; color:var(--ink); }

<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      jungle arch 168 wide (the brand green, largest), coral arch 112 wide (the single accent), jungle-soft arch 160 wide bleeding off the right edge; all three bleed off the bottom, about 40% of 960x300
  arrangement a staggered row of villa arches of falling height, space-4 gutters, like a colonnade seen from the garden
  pattern     a literal motif, from "The villa arch is the signature shape": ten small window arches, ground cut out of the jungle arch and jungle set into the soft one
  scales      every arch radius is half its width (radius-arch on the top corners only); gutters space-4; window pitch space-12 across, 68 and 68 down
-->
