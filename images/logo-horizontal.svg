<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%">
  <defs>
    <linearGradient id="hJungle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3A" />
      <stop offset="100%" stop-color="#2E7458" />
    </linearGradient>
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FF8A6E" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (Circular / Arch Badge) -->
  <g transform="translate(6, 6)">
    <!-- Base Disc -->
    <rect x="0" y="0" width="60" height="60" rx="30" fill="url(#hJungle)" />
    
    <!-- Thin Inner Ring -->
    <circle cx="30" cy="30" r="26" fill="none" stroke="#FAFDFB" stroke-width="1" opacity="0.35" />

    <!-- Stylized 'S' and 'V' with botanical leaf motif -->
    <g fill="#FFFFFE">
      <!-- 'S' Path -->
      <path d="M 33 21 C 32 19 30 18 28 18 C 24 18 22 20 22 23 C 22 27 25 28 29 30 C 34 32 37 34 37 38 C 37 42 34 45 29 45 C 25 45 22 43 21 40 L 24 38 C 25 40 27 41 29 41 C 32 41 34 39 34 38 C 34 35 31 34 27 32 C 23 30 19 28 19 23 C 19 18 23 15 28 15 C 32 15 35 17 36 20 Z" />
      
      <!-- 'V' Path -->
      <path d="M 27 25 L 34 42 L 38 42 L 44 25 L 40 25 L 36 37 L 31 25 Z" fill="url(#hGold)" />
    </g>

    <!-- Botanical Leaf Sprout Top-Right Accent -->
    <path d="M 40 16 C 45 13 49 14 50 14 C 50 15 49 19 46 22 C 44 20 42 18 40 16 Z" fill="#FF8A6E" />
    <circle cx="49" cy="14" r="1.5" fill="#FFE08A" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(82, 0)">
    <!-- Main Title -->
    <text x="0" y="38" 
          font-family="'Bricolage Grotesque', 'Figtree', system-ui, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#1D2B25">SAM VILLA</text>

    <!-- Subtitle -->
    <text x="1" y="56" 
          font-family="'Figtree', system-ui, sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="3.5" 
          fill="#2E7458">GARDEN BED &amp; BREAKFAST</text>
  </g>
</svg>
