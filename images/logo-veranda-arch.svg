<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF8A6E" />
      <stop offset="100%" stop-color="#FFAD99" />
    </linearGradient>
    <linearGradient id="jungleTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194030" />
      <stop offset="100%" stop-color="#2E7458" />
    </linearGradient>
    <clipPath id="archClip">
      <path d="M 150 160 A 100 100 0 0 1 350 160 V 330 H 150 Z" />
    </clipPath>
  </defs>

  <!-- Circular / Arch Badge Container -->
  <g id="emblem">
    <!-- Arch Border Frame -->
    <path d="M 144 160 A 106 106 0 0 1 356 160 V 336 H 144 Z" 
          fill="#FAFDFB" stroke="#2E7458" stroke-width="2.5" />
    
    <!-- Clipping region for scenic graphic inside the arch -->
    <g clip-path="url(#archClip)">
      <!-- Sky tint -->
      <rect x="140" y="50" width="220" height="290" fill="#F4FAF6" />

      <!-- Golden/Warm Morning Sun -->
      <circle cx="250" cy="190" r="54" fill="url(#terracottaSun)" />

      <!-- Soft Sun Rays -->
      <g stroke="#FFAD99" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
        <line x1="250" y1="120" x2="250" y2="106" />
        <line x1="298" y1="142" x2="308" y2="132" />
        <line x1="202" y1="142" x2="192" y2="132" />
        <line x1="318" y1="190" x2="332" y2="190" />
        <line x1="182" y1="190" x2="168" y2="190" />
      </g>

      <!-- Water / Plunge Pool Line & Veranda Deck Horizon -->
      <rect x="150" y="275" width="200" height="60" fill="#E2F1E8" />
      <line x1="150" y1="275" x2="350" y2="275" stroke="#2E7458" stroke-width="1.5" />
      <line x1="170" y1="295" x2="330" y2="295" stroke="#3D9270" stroke-width="0.8" opacity="0.5" />

      <!-- Minimalist Tropical Palm Silhouettes (Geoffrey Bawa architectural garden feel) -->
      <!-- Left Palm Fronds -->
      <g fill="#2E7458">
        <!-- Stem -->
        <path d="M 150 290 Q 200 240 215 175 Q 205 245 150 292 Z" />
        <!-- Leaflets -->
        <path d="M 215 175 Q 185 160 170 172 Q 192 180 215 175 Z" />
        <path d="M 212 186 Q 175 180 162 196 Q 188 196 212 186 Z" />
        <path d="M 206 202 Q 170 205 158 222 Q 185 216 206 202 Z" />
        <path d="M 197 222 Q 166 230 156 248 Q 180 236 197 222 Z" />
      </g>

      <!-- Right Palm Fronds -->
      <g fill="#1D4A37">
        <path d="M 350 295 Q 300 235 275 165 Q 288 240 350 297 Z" />
        <path d="M 275 165 Q 305 152 322 166 Q 298 174 275 165 Z" />
        <path d="M 278 178 Q 315 172 332 188 Q 302 190 278 178 Z" />
        <path d="M 285 196 Q 325 198 338 216 Q 308 212 285 196 Z" />
        <path d="M 296 218 Q 330 226 342 244 Q 316 232 296 218 Z" />
      </g>
    </g>

    <!-- Arch Framework Inner Accent -->
    <path d="M 158 160 A 92 92 0 0 1 342 160 V 330 H 158 Z" 
          fill="none" stroke="#2E7458" stroke-width="0.8" opacity="0.6" />
          
    <!-- Minimalist Horizontal Ground Plinth -->
    <line x1="120" y1="336" x2="380" y2="336" stroke="#2E7458" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="250" y="405" 
        text-anchor="middle" 
        font-family="'Bricolage Grotesque', 'Figtree', sans-serif" 
        font-size="42" 
        font-weight="700" 
        letter-spacing="10" 
        fill="#1D2B25">SAM VILLA</text>

  <text x="250" y="445" 
        text-anchor="middle" 
        font-family="'Figtree', -apple-system, sans-serif" 
        font-size="13.5" 
        font-weight="600" 
        letter-spacing="5.5" 
        fill="#2E7458">BOUTIQUE GARDEN STAY</text>

  <g transform="translate(250, 470)">
    <circle cx="-35" cy="0" r="1.5" fill="#808E86" />
    <text x="0" y="4" text-anchor="middle" font-family="'Figtree', sans-serif" font-size="11" letter-spacing="3" fill="#55665D">MATTEGODA</text>
    <circle cx="35" cy="0" r="1.5" fill="#808E86" />
  </g>
</svg>
